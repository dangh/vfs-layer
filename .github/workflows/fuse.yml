name: FUSE Integration

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  real-fuse:
    name: Real FUSE mount test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install FUSE tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo modprobe fuse || true
          test -e /dev/fuse
          sudo chmod a+rw /dev/fuse
          fusermount3 --version

      - name: Run normal test suite
        run: go test ./...

      - name: Run real FUSE integration test
        run: go test -tags fuse ./internal/view -run TestRealFuseSidecarWorkflow -count=1 -v
